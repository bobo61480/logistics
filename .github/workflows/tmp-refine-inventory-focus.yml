name: Refine inventory focus fix

on:
  push:
    branches:
      - fix/current-import-inventory-focus-20260810

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-import-inventory-focus-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refine source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          text = p.read_text()
          old = "// Inbound Schedule calendar it feeds) went empty. It's now a rolling window measured back from\n// today, computed at module load, so it keeps working without needing a manual date bump."
          new = "// Inbound Schedule calendar it feeds) went empty. The cutoff is now the explicit July 1, 2026\n// operational boundary, while source status determines whether a July+ shipment is still current."
          if text.count(old) != 1:
              raise SystemExit(f'cutoff comment: expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '      wrap.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });\n'
          if text.count(marker) != 2:
              raise SystemExit(f'focus marker: expected 2 matches, found {text.count(marker)}')
          # The Low Stock effect already has focus; add it only to the first/generic InventoryPanel effect.
          generic = marker + '    });\n    return () => window.cancelAnimationFrame(frame);\n  }, [displayedItems, selectedItem, showLocation]);'
          replacement = marker + '      matchedRow.focus({ preventScroll: true });\n    });\n    return () => window.cancelAnimationFrame(frame);\n  }, [displayedItems, selectedItem, showLocation]);'
          if text.count(generic) != 1:
              raise SystemExit(f'generic inventory effect: expected 1 match, found {text.count(generic)}')
          text = text.replace(generic, replacement, 1)
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Commit refinement and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-refine-inventory-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/tmp-refine-inventory-focus.yml
          git diff --cached --check
          git commit -m "Refine inventory focus and import cutoff notes"
          git push origin HEAD:fix/current-import-inventory-focus-20260810
