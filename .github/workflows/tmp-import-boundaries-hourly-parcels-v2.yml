name: Apply import boundary fix v2

on:
  push:
    branches:
      - fix/import-boundaries-hourly-parcels-20260810

permissions:
  contents: write

jobs:
  patch-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-boundaries-hourly-parcels-20260810
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run corrected source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-import-boundaries-hourly-parcels.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          old = '    return text[:a] + replacement + text[b:]'
          new = '    return text[:a] + replacement + (text[b + len(end):] if replacement.endswith(end) else text[b:])'
          if script.count(old) != 1:
              raise SystemExit(f'patch helper: expected one match, found {script.count(old)}')
          script = script.replace(old, new, 1)
          exec(compile(script, '<corrected-import-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate Apps Script syntax
        shell: bash
        run: |
          node --check < google-apps-script/Code.gs
          node --check < google-apps-script/InventorySync.gs
          node --check < google-apps-script/Triggers.gs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Commit validated fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/tmp-import-boundaries-hourly-parcels.yml
          rm .github/workflows/tmp-import-boundaries-hourly-parcels-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx google-apps-script/Code.gs google-apps-script/InventorySync.gs google-apps-script/Triggers.gs SMALL_PARCELS_TRACKING.md .github/workflows/tmp-import-boundaries-hourly-parcels.yml .github/workflows/tmp-import-boundaries-hourly-parcels-v2.yml
          git diff --cached --check
          git commit -m "Fix import boundaries and hourly parcel write-back"
          git push origin HEAD:fix/import-boundaries-hourly-parcels-20260810
