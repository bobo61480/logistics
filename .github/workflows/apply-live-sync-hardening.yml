# one-time source patch; delete after successful commit
name: Apply live sync hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-sync-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch source-first refresh behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('const AUTO_REFRESH_MS = 15 * 60 * 1000;', 'const AUTO_REFRESH_MS = 60 * 1000;')
          old = '''      await postStatus(item, status);\n      setItems((current) =>\n        current.map((record) => (record.id === item.id ? { ...record, status } : record)),\n      );\n      setNotice(`${item.title} updated to ${status}.`);'''
          new = '''      await postStatus(item, status);\n      // Source-first writeback: after the Google Sheet confirms persistence, re-read\n      // every live source so schedules, KPIs and inventory reflect the authoritative\n      // backend immediately instead of relying on an optimistic local-only patch.\n      await load();\n      setNextRefreshAt(new Date(Date.now() + AUTO_REFRESH_MS));\n      setNotice(`${item.title} updated to ${status} in the source and re-synced.`);'''
          if old not in s:
              raise SystemExit('handleStatus patch target not found')
          s = s.replace(old, new)
          s = s.replace('AUTO SYNC 15 MIN · LAST SYNC', 'AUTO SYNC 1 MIN · LAST SYNC')
          s = s.replace('AUTO-REFRESH 15 MIN · STATUS EDITS SYNC TO SOURCE ROWS', 'AUTO-REFRESH 1 MIN · SOURCE-FIRST WRITEBACKS · VERIFIED RE-SYNC')
          p.write_text(s)
          PY

      - name: Commit app synchronization hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx
          git diff --cached --quiet && { echo 'No app patch required.'; exit 0; }
          git commit -m 'Make dashboard writebacks source-first and re-sync live data every minute'
          git push origin HEAD:main
