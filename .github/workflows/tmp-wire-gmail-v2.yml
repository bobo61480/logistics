name: Wire Gmail pipeline v2
on:
  push:
    branches: [fix/gmail-logistics-pipeline-v2-20260810]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-logistics-pipeline-v2-20260810
          fetch-depth: 0
      - name: Wire v2 handler and approval path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('google-apps-script/GmailPipeline.gs')
          text = p.read_text()
          pattern = r'function processLogisticsEmails\(\) \{.*?\n\}\n\n(?=function )'
          replacement = '''function processLogisticsEmails() {
            // Compatibility entry point for any pre-existing trigger. V2 owns message-level
            // dedupe, broader logistics discovery, source-row updates, and trigger migration.
            return processLogisticsEmailsV2();
          }

          '''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count == 1:
              p.write_text(new_text)
          elif 'return processLogisticsEmailsV2();' not in text:
              raise SystemExit('processLogisticsEmails wiring target not found')

          t = Path('google-apps-script/Triggers.gs')
          trigger_text = t.read_text()
          trigger_text = trigger_text.replace(
              '{ handler: "processLogisticsEmails", minutes: 15 }',
              '{ handler: "processLogisticsEmailsV2", minutes: 15 }'
          )
          if 'GMAIL_PIPELINE_TRIGGER_SYNC_VERSION' not in trigger_text:
              anchor = '/* eslint-disable no-unused-vars */\n'
              trigger_text = trigger_text.replace(anchor, anchor + '\nvar GMAIL_PIPELINE_TRIGGER_SYNC_VERSION = "2026-08-10-gmail-v2";\n', 1)
          t.write_text(trigger_text)

          v = Path('google-apps-script/Validation.gs')
          validation = v.read_text()
          old = 'if (kind === "inbound") { record.eta = when || record.eta; upsertInboundRow_(record); }\n        else { record.shipDate = when || record.shipDate; upsertOutboundRow_(record); }'
          new = 'if (kind === "inbound") { record.eta = when || record.eta; upsertInboundEmailV2_(record, true); }\n        else { record.shipDate = when || record.shipDate; upsertOutboundEmailV2_(record, true); }'
          if old in validation:
              validation = validation.replace(old, new, 1)
          elif 'upsertInboundEmailV2_(record, true)' not in validation:
              raise SystemExit('approval upsert wiring target not found')
          v.write_text(validation)
          PY
      - name: Validate Apps Script source
        run: |
          node --check < google-apps-script/GmailPipelineV2.gs
          node --check < google-apps-script/GmailPipeline.gs
          node --check < google-apps-script/Validation.gs
          node --check < google-apps-script/Triggers.gs
          git diff --check
      - name: Run frontend regression tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Commit source wiring
        run: |
          if git diff --quiet -- google-apps-script/; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/GmailPipeline.gs google-apps-script/Validation.gs google-apps-script/Triggers.gs
          git diff --cached --check
          git commit -m "Wire Gmail logistics pipeline v2"
          git push origin HEAD:fix/gmail-logistics-pipeline-v2-20260810
