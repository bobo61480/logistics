name: Deploy canonical logistics site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          test -f out/light/index.html
          test -f out/light-skin/index.html
          test -f out/light-full/index.html
          test -f out/fulfillment-style/index.html

      - name: Deploy canonical Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify live custom domain, appearance routes, and Worker APIs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            suffix="?release=${GITHUB_SHA}&attempt=${attempt}"
            failed=0
            for route in "/" "/light-skin" "/light" "/light-full" "/fulfillment-style"; do
              safe_name="$(echo "$route" | tr '/' '_' | sed 's/^_$/root/')"
              if ! curl -fsSL --max-time 30 "https://stylekorean.dpdns.org${route}${suffix}" -o "/tmp/live-${safe_name}.html"; then
                echo "Route failed on attempt ${attempt}: ${route}"
                failed=1
                break
              fi
            done

            if [ "$failed" -eq 0 ] \
              && curl -fsSL --max-time 30 -D /tmp/live-health.headers "https://stylekorean.dpdns.org/api/logistics/health${suffix}" -o /tmp/live-health.json \
              && curl -fsSL --max-time 30 "https://stylekorean.dpdns.org/api/logistics/reconciliation${suffix}" -o /tmp/live-reconciliation.json \
              && curl -fsSL --max-time 60 "https://stylekorean.dpdns.org/api/logistics/snapshot${suffix}" -o /tmp/live-snapshot.json \
              && grep -Fq '"ok":true' /tmp/live-health.json \
              && grep -Fq '"ok":true' /tmp/live-snapshot.json \
              && grep -Fq 'sourceHealth' /tmp/live-snapshot.json \
              && grep -Fq 'generatedAt' /tmp/live-snapshot.json \
              && grep -Fiq 'x-content-type-options: nosniff' /tmp/live-health.headers \
              && grep -Fiq 'x-frame-options: DENY' /tmp/live-health.headers \
              && node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync("/tmp/live-health.json","utf8")); const reconciliation=JSON.parse(fs.readFileSync("/tmp/live-reconciliation.json","utf8")); const snapshot=JSON.parse(fs.readFileSync("/tmp/live-snapshot.json","utf8")); if(health.ok!==true||health.version!=="2026-08-12-worker-v5-d1-ready"||typeof health.databaseConfigured!=="boolean"||reconciliation.ok!==true||reconciliation.databaseConfigured!==health.databaseConfigured||snapshot.ok!==true||!Array.isArray(snapshot.sourceHealth)||Number.isNaN(Date.parse(snapshot.generatedAt))) process.exit(1); if(health.databaseConfigured&&(!String(health.dataStore).includes("D1")||reconciliation.ready!==true)) process.exit(1); if(!health.databaseConfigured&&health.dataStore!=="Google Sheets") process.exit(1); const core=new Map(snapshot.sourceHealth.map(i=>[i.name,i])); for(const name of ["IMPORTS","Outbound Shipping Schedule"]){if(!core.get(name)?.ok){console.error(`Core source unhealthy: ${name}`);process.exit(1)}} console.log(`Live Worker ${health.version}; D1 configured=${health.databaseConfigured}; snapshot ${snapshot.generatedAt}; ${snapshot.sourceHealth.length} source checks.`);'; then
              echo "Live custom domain, all five appearance routes, health API, and snapshot API verified."
              exit 0
            fi

            echo "Live verification attempt ${attempt} failed."
            test -f /tmp/live-health.json && head -c 800 /tmp/live-health.json || true
            test -f /tmp/live-snapshot.json && head -c 1200 /tmp/live-snapshot.json || true
            sleep 10
          done
          echo "Production verification failed after six attempts."
          exit 1
