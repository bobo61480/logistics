name: Deploy canonical logistics site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export markers
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          grep -q 'FULFILLMENT · TK' out/index.html
          grep -q 'Fulfillment TK Orders' out/index.html
          grep -q 'AUTO SYNC 15 MIN' out/index.html

      - name: Deploy canonical Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify live custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            url="https://stylekorean.dpdns.org/?release=${GITHUB_SHA}&attempt=${attempt}"
            if curl -fsSL --max-time 30 "$url" -o /tmp/live.html \
              && grep -q 'FULFILLMENT · TK' /tmp/live.html \
              && grep -q 'Fulfillment TK Orders' /tmp/live.html \
              && grep -q 'AUTO SYNC 15 MIN' /tmp/live.html; then
              echo "Live custom domain is serving the TK fulfillment dashboard build."
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not expose TK fulfillment dashboard markers after deployment."
          exit 1
