name: Deploy canonical logistics site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          test -f out/light/index.html
          test -f out/light-skin/index.html
          test -f out/light-full/index.html
          test -f out/fulfillment-style/index.html

      - name: Provision and migrate production D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          database_name="stylekorean-logistics-read-model"
          databases="$(npx wrangler d1 list --json)"
          database_id="$(DATABASES="$databases" DATABASE_NAME="$database_name" node -e 'const rows=JSON.parse(process.env.DATABASES); const match=rows.find((row)=>row.name===process.env.DATABASE_NAME); process.stdout.write(match?.uuid || "")')"

          if [ -z "$database_id" ]; then
            npx wrangler d1 create "$database_name" --location wnam
            databases="$(npx wrangler d1 list --json)"
            database_id="$(DATABASES="$databases" DATABASE_NAME="$database_name" node -e 'const rows=JSON.parse(process.env.DATABASES); const match=rows.find((row)=>row.name===process.env.DATABASE_NAME); process.stdout.write(match?.uuid || "")')"
          fi

          test -n "$database_id"
          cp wrangler.toml .wrangler.production.toml
          cat >> .wrangler.production.toml <<EOF

          [[d1_databases]]
          binding = "DB"
          database_name = "$database_name"
          database_id = "$database_id"
          migrations_dir = "./migrations"
          EOF
          npx wrangler d1 migrations apply "$database_name" --remote --config .wrangler.production.toml

      - name: Deploy canonical Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .wrangler.production.toml

      - name: Verify live custom domain, appearance routes, and Worker APIs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            suffix="?release=${GITHUB_SHA}&attempt=${attempt}"
            failed=0
            for route in "/" "/light-skin" "/light" "/light-full" "/fulfillment-style"; do
              safe_name="$(echo "$route" | tr '/' '_' | sed 's/^_$/root/')"
              if ! curl -fsSL --max-time 30 "https://stylekorean.dpdns.org${route}${suffix}" -o "/tmp/live-${safe_name}.html"; then
                echo "Route failed on attempt ${attempt}: ${route}"
                failed=1
                break
              fi
            done

            if [ "$failed" -eq 0 ] \
              && curl -fsSL --max-time 30 -D /tmp/live-health.headers "https://stylekorean.dpdns.org/api/logistics/health${suffix}" -o /tmp/live-health.json \
              && curl -fsSL --max-time 30 "https://stylekorean.dpdns.org/api/logistics/reconciliation${suffix}" -o /tmp/live-reconciliation.json \
              && curl -fsSL --max-time 60 "https://stylekorean.dpdns.org/api/logistics/snapshot${suffix}" -o /tmp/live-snapshot.json \
              && grep -Fq '"ok":true' /tmp/live-health.json \
              && grep -Fq '"ok":true' /tmp/live-snapshot.json \
              && grep -Fq 'sourceHealth' /tmp/live-snapshot.json \
              && grep -Fq 'generatedAt' /tmp/live-snapshot.json \
              && grep -Fiq 'x-content-type-options: nosniff' /tmp/live-health.headers \
              && grep -Fiq 'x-frame-options: DENY' /tmp/live-health.headers \
              && node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync("/tmp/live-health.json","utf8")); const reconciliation=JSON.parse(fs.readFileSync("/tmp/live-reconciliation.json","utf8")); const snapshot=JSON.parse(fs.readFileSync("/tmp/live-snapshot.json","utf8")); if(health.ok!==true||health.version!=="2026-08-12-worker-v6-d1-active"||health.databaseConfigured!==true||!String(health.dataStore).includes("D1")||reconciliation.ok!==true||reconciliation.databaseConfigured!==true||reconciliation.ready!==true||snapshot.ok!==true||snapshot.storage!=="d1"||!Array.isArray(snapshot.sourceHealth)||Number.isNaN(Date.parse(snapshot.generatedAt))) process.exit(1); const sources=new Map(snapshot.sourceHealth.map(i=>[i.name,i])); if(!sources.get("IMPORTS")?.ok) process.exit(1); const meta=snapshot.sources?.outboundMeta; if(!meta||!["Outbound Shipping Schedule","WH Trucking Request"].includes(meta.sheetName)) process.exit(1); if(!sources.get(meta.sheetName)?.ok){console.error(`Effective outbound source unhealthy: ${meta.sheetName}`);process.exit(1)} console.log(`Live Worker ${health.version}; D1 active; outbound=${meta.sheetName}; snapshot ${snapshot.generatedAt}; ${snapshot.sourceHealth.length} source checks.`);'; then
              echo "Live custom domain, all five appearance routes, health API, and snapshot API verified."
              exit 0
            fi

            echo "Live verification attempt ${attempt} failed."
            test -f /tmp/live-health.json && head -c 800 /tmp/live-health.json || true
            test -f /tmp/live-snapshot.json && head -c 1200 /tmp/live-snapshot.json || true
            sleep 10
          done
          echo "Production verification failed after six attempts."
          exit 1
