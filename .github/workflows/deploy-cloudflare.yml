name: Deploy canonical logistics site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next

      - name: Deploy canonical Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify live custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            root="https://stylekorean.dpdns.org/?release=${GITHUB_SHA}&attempt=${attempt}"
            light="https://stylekorean.dpdns.org/light?release=${GITHUB_SHA}&attempt=${attempt}"
            fulfillment="https://stylekorean.dpdns.org/fulfillment-style?release=${GITHUB_SHA}&attempt=${attempt}"
            if curl -fsSL --max-time 30 "$root" -o /tmp/live-root.html \
              && curl -fsSL --max-time 30 "$light" -o /tmp/live-light.html \
              && curl -fsSL --max-time 30 "$fulfillment" -o /tmp/live-fulfillment.html; then
              echo "Live custom domain and all three appearance routes are responding."
              exit 0
            fi
            sleep 10
          done
          echo "Live site or one of the appearance routes did not respond after deployment."
          exit 1
