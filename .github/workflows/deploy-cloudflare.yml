name: Deploy canonical logistics site to Cloudflare
# Production redeploy requested 2026-08-14

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          test -f out/light/index.html
          test -f out/light-skin/index.html
          test -f out/light-full/index.html
          test -f out/fulfillment-style/index.html

      - name: Apply D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          # wrangler.toml declares the D1 binding statically (both this workflow
          # and Cloudflare's native Workers Builds Git integration deploy from
          # the same file, so the binding must not depend on a runtime probe).
          # Applying migrations here is idempotent — wrangler tracks what has
          # already run in the database's own d1_migrations table.
          #
          # Non-fatal on purpose: a failure here (e.g. CLOUDFLARE_ACCOUNT_ID/
          # CLOUDFLARE_API_TOKEN scoped to the wrong account for this database)
          # must not block the Worker deploy step below — the deploy is what
          # actually keeps production current, and migrations are idempotent,
          # so a later successful run catches up once credentials are fixed.
          if ! npx wrangler d1 migrations apply stylekorean-logistics-read-model --remote; then
            echo "::warning::D1 migrations apply failed — continuing without blocking the Worker deploy. Investigate CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN access to this database."
          fi

      - name: Deploy canonical Worker and restore production route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Required by the `gh issue create` fallback below — without it, gh
          # has no credential and fails before the real failure can even be
          # filed as an issue (confirmed: "set the GH_TOKEN environment
          # variable" on a live run where this step failed).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A version-only deployment cannot recover a detached zone route.
          # Canonical deploy validates and restores the configured route, assets,
          # D1 binding, rate limiter, and Worker code together.
          set +e
          npx wrangler deploy --keep-vars 2>&1 | tee /tmp/cloudflare-route-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_status" -ne 0 ]; then
            {
              echo "Cloudflare route recovery failed for commit ${GITHUB_SHA}."
              echo
              echo '```text'
              sed -n '1,160p' /tmp/cloudflare-route-deploy.log
              echo '```'
            } > /tmp/cloudflare-route-failure.md
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Production route recovery failed ${GITHUB_SHA::7}" \
              --body-file /tmp/cloudflare-route-failure.md
            exit "$deploy_status"
          fi

      - name: Verify live custom domain, appearance routes, and Worker APIs
        shell: bash
        env:
          # wrangler.toml declares the D1 binding statically now, so a
          # successful deploy always carries it — there is no more
          # runtime-probed fallback state to read from a prior step.
          EXPECTED_DATABASE_CONFIGURED: "true"
        run: |
          set -euo pipefail
          fetch_route() {
            local url="$1"
            local body_file="$2"
            local headers_file="$3"
            local status

            status="$(curl -sSL --max-time 30 \
              -H 'Accept: text/html,application/xhtml+xml' \
              -H 'User-Agent: StyleKorean-Production-Smoke/1.0' \
              -D "$headers_file" \
              -o "$body_file" \
              -w '%{http_code}' \
              "$url")" || status="curl-error"

            if [[ "$status" == 2* ]]; then
              return 0
            fi

            echo "Route request failed with HTTP ${status}: ${url}"
            echo "Response headers:"
            sed -n '1,40p' "$headers_file" 2>/dev/null || true
            echo "Response body (first 1,200 bytes):"
            head -c 1200 "$body_file" 2>/dev/null || true
            echo
            return 1
          }

          for attempt in 1 2 3 4 5 6; do
            suffix="?release=${GITHUB_SHA}&attempt=${attempt}"
            failed=0
            for route in "/" "/light-skin" "/light" "/light-full" "/fulfillment-style"; do
              safe_name="$(echo "$route" | tr '/' '_' | sed 's/^_$/root/')"
              if ! fetch_route \
                "https://stylekorean.dpdns.org${route}${suffix}" \
                "/tmp/live-${safe_name}.html" \
                "/tmp/live-${safe_name}.headers"; then
                echo "Route failed on attempt ${attempt}: ${route}"
                failed=1
                break
              fi
              if ! grep -Fiq 'StyleKorean' "/tmp/live-${safe_name}.html"; then
                echo "StyleKorean application marker missing on attempt ${attempt}: ${route}"
                head -c 1200 "/tmp/live-${safe_name}.html" || true
                echo
                failed=1
                break
              fi
            done

            if [ "$failed" -eq 0 ] \
              && curl -fsSL --max-time 30 -D /tmp/live-health.headers "https://stylekorean.dpdns.org/api/logistics/health${suffix}" -o /tmp/live-health.json \
              && curl -fsSL --max-time 30 "https://stylekorean.dpdns.org/api/logistics/reconciliation${suffix}" -o /tmp/live-reconciliation.json \
              && curl -fsSL --max-time 60 "https://stylekorean.dpdns.org/api/logistics/snapshot${suffix}" -o /tmp/live-snapshot.json \
              && grep -Fq '"ok":true' /tmp/live-health.json \
              && grep -Fq '"ok":true' /tmp/live-snapshot.json \
              && grep -Fq 'sourceHealth' /tmp/live-snapshot.json \
              && grep -Fq 'generatedAt' /tmp/live-snapshot.json \
              && grep -Fiq 'x-content-type-options: nosniff' /tmp/live-health.headers \
              && grep -Fiq 'x-frame-options: DENY' /tmp/live-health.headers \
              && node -e 'const fs=require("fs"); const expectedDb=process.env.EXPECTED_DATABASE_CONFIGURED==="true"; const health=JSON.parse(fs.readFileSync("/tmp/live-health.json","utf8")); const reconciliation=JSON.parse(fs.readFileSync("/tmp/live-reconciliation.json","utf8")); const snapshot=JSON.parse(fs.readFileSync("/tmp/live-snapshot.json","utf8")); if(health.ok!==true||health.version!=="2026-08-13-worker-v8-public-guardrails"||health.accessPolicy!=="public"||health.statusWriteAuthentication!=="none"||!String(health.statusWriteRateLimit).includes("30 requests per 60 seconds")||health.databaseConfigured!==expectedDb||reconciliation.ok!==true||reconciliation.databaseConfigured!==expectedDb||snapshot.ok!==true||!Array.isArray(snapshot.sourceHealth)||Number.isNaN(Date.parse(snapshot.generatedAt))) process.exit(1); if(expectedDb&&(reconciliation.ready!==true||snapshot.storage!=="d1"||snapshot.stale===true||!String(health.dataStore).includes("D1")||Number(health.databaseAgeSeconds)>30*60||Date.now()-Date.parse(snapshot.generatedAt)>30*60*1000)) process.exit(1); if(!expectedDb&&(reconciliation.ready!==false||reconciliation.activationRequired!==true||snapshot.storage!=="sheets")) process.exit(1); const sources=new Map(snapshot.sourceHealth.map(i=>[i.name,i])); if(!sources.get("IMPORTS")?.ok) process.exit(1); const meta=snapshot.sources?.outboundMeta; if(!meta||!["Outbound Shipping Schedule","WH Trucking Request"].includes(meta.sheetName)) process.exit(1); if(!sources.get(meta.sheetName)?.ok){console.error(`Effective outbound source unhealthy: ${meta.sheetName}`);process.exit(1)} console.log(`Live Worker ${health.version}; storage=${snapshot.storage}; ageSeconds=${health.databaseAgeSeconds}; outbound=${meta.sheetName}; snapshot ${snapshot.generatedAt}; ${snapshot.sourceHealth.length} source checks.`);'; then
              echo "Live custom domain, all five appearance routes, health API, and snapshot API verified."
              exit 0
            fi

            echo "Live verification attempt ${attempt} failed."
            test -f /tmp/live-health.json && head -c 800 /tmp/live-health.json || true
            test -f /tmp/live-snapshot.json && head -c 1200 /tmp/live-snapshot.json || true
            sleep 10
          done
          echo "Production verification failed after six attempts."
          exit 1
