name: Deploy canonical logistics site to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export markers
        run: |
          set -euo pipefail
          test -f out/index.html
          grep -q 'FULFILLMENT · TK' out/index.html
          grep -q 'AUTO SYNC 15 MIN' out/index.html

      - name: Deploy canonical Worker (CLOUDFLARE_* secrets)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Deploy canonical Worker (CF_* secrets fallback)
        if: ${{ (secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '') && secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Fail when Cloudflare secrets are missing
        if: ${{ (secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '') && (secrets.CF_API_TOKEN == '' || secrets.CF_ACCOUNT_ID == '') }}
        run: |
          echo "::error::Missing Cloudflare deploy credentials. Configure either CLOUDFLARE_API_TOKEN+CLOUDFLARE_ACCOUNT_ID or CF_API_TOKEN+CF_ACCOUNT_ID."
          exit 1

      - name: Verify live custom domain
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            url="https://stylekorean.dpdns.org/?release=${GITHUB_SHA}&attempt=${attempt}"
            if curl -fsSL --max-time 30 "$url" -o /tmp/live.html \
              && grep -q 'FULFILLMENT · TK' /tmp/live.html \
              && grep -q 'AUTO SYNC 15 MIN' /tmp/live.html; then
              echo "Live custom domain is serving the canonical logistics build."
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not expose canonical build markers after deployment."
          exit 1
