name: Deploy canonical logistics site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify canonical export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          test -f out/light/index.html
          test -f out/light-skin/index.html
          test -f out/light-full/index.html
          test -f out/fulfillment-style/index.html

      - name: Apply D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if ! npx wrangler d1 migrations apply stylekorean-logistics-read-model --remote; then
            echo "::warning::D1 migrations apply failed — continuing so Worker deployment can still proceed."
          fi

      - name: Deploy canonical Worker and preserve production route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_IMS_API_KEY: ${{ secrets.CMS_IMS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${CMS_IMS_API_KEY:-}" ]; then
            printf '%s' "$CMS_IMS_API_KEY" | npx wrangler secret put CMS_IMS_API_KEY --name stylekorean
          else
            echo "CMS_IMS_API_KEY repository secret is not configured"
            exit 1
          fi
          # A version-only deployment cannot recover a detached zone route, so
          # canonical deploy is attempted first. The current production token
          # can publish Worker versions but may not be allowed to list/edit zone
          # routes. On that exact auth failure, preserve the already-attached
          # route and deploy the new code/assets/bindings as a Worker version.
          set +e
          npx wrangler deploy --keep-vars 2>&1 | tee /tmp/cloudflare-route-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_status" -ne 0 ] && grep -Fq 'Authentication error [code: 10000]' /tmp/cloudflare-route-deploy.log; then
            echo "::warning::Deploy token cannot manage zone routes; preserving existing route and publishing Worker version."
            release_tag="release-${GITHUB_SHA}"
            npx wrangler versions upload --keep-vars --tag "$release_tag" --message "Production release ${GITHUB_SHA}"
            npx wrangler versions deploy --version-tag "${release_tag}@100%" --message "Production release ${GITHUB_SHA}" --yes
            deploy_status=0
          fi
          if [ "$deploy_status" -ne 0 ]; then
            {
              echo "Cloudflare route recovery failed for commit ${GITHUB_SHA}."
              echo
              echo '```text'
              sed -n '1,160p' /tmp/cloudflare-route-deploy.log
              echo '```'
            } > /tmp/cloudflare-route-failure.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Production route recovery failed ${GITHUB_SHA::7}" --body-file /tmp/cloudflare-route-failure.md
            exit "$deploy_status"
          fi

      - name: Inspect custom-domain DNS and edge state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          zone_id="5d128576939145a0274370efd693dafe"
          host="stylekorean.dpdns.org"

          echo "::group::Cloudflare zone DNS records"
          curl -sS --max-time 20 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${host}" \
            -o /tmp/cf-dns.json
          node - <<'NODE'
          const fs = require('fs');
          try {
            const body = JSON.parse(fs.readFileSync('/tmp/cf-dns.json','utf8'));
            console.log(JSON.stringify({ success: body.success, errors: body.errors, result: (body.result || []).map(r => ({ id:r.id,type:r.type,name:r.name,content:r.content,proxied:r.proxied,ttl:r.ttl })) }, null, 2));
          } catch (error) {
            console.log('Cloudflare DNS response was not valid JSON:', String(error));
          }
          NODE
          echo "::endgroup::"

          echo "::group::Cloudflare Worker custom domains"
          curl -sS --max-time 20 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/records" \
            -o /tmp/cf-domains.json
          node - <<'NODE'
          const fs = require('fs');
          try {
            const body = JSON.parse(fs.readFileSync('/tmp/cf-domains.json','utf8'));
            const rows = Array.isArray(body.result) ? body.result.filter(r => String(r.hostname || r.name || '').includes('stylekorean.dpdns.org')) : [];
            console.log(JSON.stringify({ success: body.success, errors: body.errors, result: rows }, null, 2));
          } catch (error) {
            console.log('Cloudflare domains response was not valid JSON:', String(error));
          }
          NODE
          echo "::endgroup::"

          echo "::group::Public DNS resolution"
          echo "getent ahosts:"
          getent ahosts "$host" || true
          echo "Google DNS A:"
          curl -sS --max-time 20 "https://dns.google/resolve?name=${host}&type=A" || true
          echo
          echo "Google DNS AAAA:"
          curl -sS --max-time 20 "https://dns.google/resolve?name=${host}&type=AAAA" || true
          echo
          echo "Google DNS NS:"
          curl -sS --max-time 20 "https://dns.google/resolve?name=${host}&type=NS" || true
          echo
          echo "::endgroup::"

          echo "::group::TLS/HTTP edge probe"
          curl -vkI --connect-timeout 10 --max-time 20 "https://${host}/" 2>&1 | sed -n '1,120p' || true
          echo "::endgroup::"

      - name: Verify live custom domain, D1 frontend, and Worker APIs
        shell: bash
        env:
          EXPECTED_DATABASE_CONFIGURED: "true"
        run: |
          set -euo pipefail
          fetch_route() {
            local url="$1"
            local body_file="$2"
            local headers_file="$3"
            local status
            status="$(curl -sSL --max-time 30 -H 'Accept: text/html,application/xhtml+xml' -H 'User-Agent: StyleKorean-Production-Smoke/1.0' -D "$headers_file" -o "$body_file" -w '%{http_code}' "$url")" || status="curl-error"
            if [[ "$status" == 2* ]]; then return 0; fi
            echo "Route request failed with HTTP ${status}: ${url}"
            sed -n '1,40p' "$headers_file" 2>/dev/null || true
            head -c 1200 "$body_file" 2>/dev/null || true
            echo
            return 1
          }

          month="$(TZ=America/Los_Angeles date +%Y-%m)"
          for attempt in 1 2 3 4 5 6; do
            suffix="?release=${GITHUB_SHA}&attempt=${attempt}"
            failed=0
            for route in "/" "/light-skin" "/light" "/light-full" "/fulfillment-style"; do
              safe_name="$(echo "$route" | tr '/' '_' | sed 's/^_$/root/')"
              if ! fetch_route "https://stylekorean.dpdns.org${route}${suffix}" "/tmp/live-${safe_name}.html" "/tmp/live-${safe_name}.headers"; then failed=1; break; fi
              if ! grep -Fiq 'StyleKorean' "/tmp/live-${safe_name}.html"; then
                echo "StyleKorean application marker missing on attempt ${attempt}: ${route}"
                failed=1
                break
              fi
            done

            if [ "$failed" -eq 0 ] \
              && curl -fsSL --max-time 30 -D /tmp/live-health.headers "https://stylekorean.dpdns.org/api/logistics/health${suffix}" -o /tmp/live-health.json \
              && curl -fsSL --max-time 30 "https://stylekorean.dpdns.org/api/logistics/reconciliation${suffix}" -o /tmp/live-reconciliation.json \
              && curl -fsSL --max-time 120 "https://stylekorean.dpdns.org/api/logistics/snapshot${suffix}" -o /tmp/live-snapshot.json \
              && curl -fsSL --max-time 120 "https://stylekorean.dpdns.org/api/logistics/monthly-kpis?month=${month}&release=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/live-monthly-kpis.json \
              && grep -Fq '"ok":true' /tmp/live-health.json \
              && grep -Fq '"ok":true' /tmp/live-snapshot.json \
              && grep -Fq 'sourceHealth' /tmp/live-snapshot.json \
              && grep -Fq 'generatedAt' /tmp/live-snapshot.json \
              && grep -Fiq 'x-content-type-options: nosniff' /tmp/live-health.headers \
              && grep -Fiq 'x-frame-options: DENY' /tmp/live-health.headers \
              && node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync("/tmp/live-health.json","utf8")); const reconciliation=JSON.parse(fs.readFileSync("/tmp/live-reconciliation.json","utf8")); const snapshot=JSON.parse(fs.readFileSync("/tmp/live-snapshot.json","utf8")); const monthly=JSON.parse(fs.readFileSync("/tmp/live-monthly-kpis.json","utf8")); if(health.ok!==true||health.version!=="2026-09-02-worker-v12-sse-d1-fastpath"||health.frontendSource!=="d1"||health.databaseConfigured!==true||health.databaseReady!==true||reconciliation.ok!==true||reconciliation.frontendSource!=="d1"||snapshot.ok!==true||snapshot.storage!=="d1"||snapshot.frontendSource!=="d1"||snapshot.stale===true||!Array.isArray(snapshot.sourceHealth)||Number.isNaN(Date.parse(snapshot.generatedAt))) process.exit(1); if(monthly.ok!==true||!monthly.kpis||!Number.isFinite(monthly.kpis.wmsSalesMtd)||!Number.isFinite(monthly.kpis.wmsSalesYtd)||!["siliconii-cms-invoices","wms-sheet-fallback"].includes(monthly.source)) process.exit(1); if(!String(health.dataStore).includes("D1")||Number(health.databaseAgeSeconds)>30*60||Date.now()-Date.parse(snapshot.generatedAt)>30*60*1000) process.exit(1); const sources=new Map(snapshot.sourceHealth.map(i=>[i.name,i])); if(!sources.get("IMPORTS")?.ok) process.exit(1); const meta=snapshot.sources?.outboundMeta; if(!meta||!["Outbound Shipping Schedule","WH Trucking Request"].includes(meta.sheetName)||!sources.get(meta.sheetName)?.ok) process.exit(1); console.log(`Live ${health.version}; frontend=${health.frontendSource}; storage=${snapshot.storage}; sales=${monthly.source}; ageSeconds=${health.databaseAgeSeconds}; snapshot=${snapshot.generatedAt}`);'; then
              echo "Live custom domain, D1 frontend, and Worker APIs verified."
              exit 0
            fi

            echo "Live verification attempt ${attempt} failed."
            test -f /tmp/live-health.json && head -c 900 /tmp/live-health.json || true
            test -f /tmp/live-snapshot.json && head -c 1200 /tmp/live-snapshot.json || true
            test -f /tmp/live-monthly-kpis.json && head -c 900 /tmp/live-monthly-kpis.json || true
            sleep 10
          done
          echo "Production verification failed after six attempts."
          exit 1
