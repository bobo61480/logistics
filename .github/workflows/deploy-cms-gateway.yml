name: Deploy read-only CMS gateway

on:
  push:
    branches: [main]
    paths:
      - 'cms-gateway/**'
      - 'wrangler.cms-gateway.toml'
      - '.github/workflows/deploy-cms-gateway.yml'
      - 'scripts/verify-cms-gateway.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Create them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "Required secrets are configured; CMS_* secrets are optional and handled during configuration."

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck project
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Configure CMS gateway secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_MCP_AUTH_TOKEN: ${{ secrets.CMS_MCP_AUTH_TOKEN }}
          CMS_IMS_API_KEY: ${{ secrets.CMS_IMS_API_KEY }}
          CMS_AUTH_USER: ${{ secrets.CMS_AUTH_USER }}
          CMS_AUTH_PASSWORD: ${{ secrets.CMS_AUTH_PASSWORD }}
          CMS_TOTP_SECRET: ${{ secrets.CMS_TOTP_SECRET }}
          CMS_SESSION_COOKIE: ${{ secrets.CMS_SESSION_COOKIE }}
        run: |
          set -euo pipefail
          if [ -n "${CMS_MCP_AUTH_TOKEN:-}" ]; then
            printf '%s' "$CMS_MCP_AUTH_TOKEN" | npx wrangler secret put CMS_MCP_AUTH_TOKEN --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_MCP_AUTH_TOKEN is not configured; deploying without bearer forwarding."
          fi
          if [ -n "${CMS_IMS_API_KEY:-}" ]; then
            printf '%s' "$CMS_IMS_API_KEY" | npx wrangler secret put CMS_IMS_API_KEY --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_IMS_API_KEY is not configured; IMS inventory access will remain unavailable."
          fi
          if [ -n "${CMS_AUTH_USER:-}" ]; then
            printf '%s' "$CMS_AUTH_USER" | npx wrangler secret put CMS_AUTH_USER --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_AUTH_USER is not configured; unattended CMS authentication will remain disabled."
          fi
          if [ -n "${CMS_AUTH_PASSWORD:-}" ]; then
            printf '%s' "$CMS_AUTH_PASSWORD" | npx wrangler secret put CMS_AUTH_PASSWORD --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_AUTH_PASSWORD is not configured; unattended CMS authentication will remain disabled."
          fi
          if [ -n "${CMS_TOTP_SECRET:-}" ]; then
            printf '%s' "$CMS_TOTP_SECRET" | npx wrangler secret put CMS_TOTP_SECRET --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_TOTP_SECRET is not configured; unattended CMS authentication will remain disabled."
          fi
          if [ -n "${CMS_SESSION_COOKIE:-}" ]; then
            printf '%s' "$CMS_SESSION_COOKIE" | npx wrangler secret put CMS_SESSION_COOKIE --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_SESSION_COOKIE is not configured in GitHub Actions; any existing Worker secret is left unchanged."
          fi

      - name: Deploy CMS gateway Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.cms-gateway.toml 2>&1 | tee /tmp/cms-gateway-deploy.log
          grep -Eo 'https://[^ ]+workers.dev' /tmp/cms-gateway-deploy.log | tail -1 > /tmp/cms-gateway-url.txt || true
          echo "CMS gateway URL: $(cat /tmp/cms-gateway-url.txt 2>/dev/null || true)"

      - name: Verify gateway health and current-month sales
        shell: bash
        run: |
          set -euo pipefail
          gateway_url="$(cat /tmp/cms-gateway-url.txt)"
          test -n "$gateway_url"

          health_ok=0
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS --max-time 30 -o /tmp/cms-health.json -w '%{http_code}' "$gateway_url/health" || true)"
            if [ "$status" = "200" ] && grep -Fq '"ok":true' /tmp/cms-health.json; then
              health_ok=1
              break
            fi
            echo "Gateway health attempt ${attempt} returned HTTP ${status}"
            cat /tmp/cms-health.json 2>/dev/null || true
            sleep 10
          done
          if [ "$health_ok" -ne 1 ]; then
            echo "CMS gateway health never became reachable"
            exit 1
          fi

          CMS_GATEWAY_BASE_URL="$gateway_url" node scripts/verify-cms-gateway.mjs
