name: Deploy read-only CMS gateway

on:
  push:
    branches: [main]
    paths:
      - 'cms-gateway/**'
      - 'wrangler.cms-gateway.toml'
      - '.github/workflows/deploy-cms-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck project
        run: npm run typecheck

      - name: Configure optional CMS upstream auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_MCP_AUTH_TOKEN: ${{ secrets.CMS_MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CMS_MCP_AUTH_TOKEN:-}" ]; then
            printf '%s' "$CMS_MCP_AUTH_TOKEN" | npx wrangler secret put CMS_MCP_AUTH_TOKEN --name stylekorean-cms-gateway --config wrangler.cms-gateway.toml
          else
            echo "CMS_MCP_AUTH_TOKEN is not configured; deploying without bearer forwarding."
          fi

      - name: Deploy CMS gateway Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.cms-gateway.toml 2>&1 | tee /tmp/cms-gateway-deploy.log
          grep -Eo 'https://[^ ]+workers.dev' /tmp/cms-gateway-deploy.log | tail -1 > /tmp/cms-gateway-url.txt || true
          echo "CMS gateway URL: $(cat /tmp/cms-gateway-url.txt 2>/dev/null || true)"

      - name: Verify gateway health and August sales route
        shell: bash
        run: |
          set -euo pipefail
          gateway_url="$(cat /tmp/cms-gateway-url.txt)"
          test -n "$gateway_url"
          curl -fsSL --max-time 30 "$gateway_url/health" -o /tmp/cms-health.json
          grep -Fq '"ok":true' /tmp/cms-health.json
          # Sales verification may return 502 if the upstream CMS is unavailable,
          # but the route itself must exist and return JSON rather than a 404.
          status="$(curl -sS --max-time 60 -o /tmp/cms-sales.json -w '%{http_code}' "$gateway_url/sales-summary?month=2026-08" || true)"
          if [ "$status" = "404" ] || [ -z "$status" ]; then
            echo "CMS sales route is not deployed"
            exit 1
          fi
          cat /tmp/cms-health.json
          echo
          cat /tmp/cms-sales.json
          echo
