name: Apply current import inventory focus fix

on:
  push:
    branches:
      - fix/current-import-inventory-focus-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-import-inventory-focus-20260810
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply page fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()
          sp = " "

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          old = "\n".join([
              "const IMPORT_STALE_WINDOW_DAYS = 30;",
              "const IMPORT_STALE_CUTOFF = (() => {",
              sp * 2 + "const cutoff = startOfToday();",
              sp * 2 + "cutoff.setDate(cutoff.getDate() - IMPORT_STALE_WINDOW_DAYS);",
              sp * 2 + "return cutoff.getTime();",
              "})();",
          ])
          new = "\n".join([
              "// Operational import history starts July 1, 2026. Keep every non-terminal import",
              "// from that point forward visible until its source status says it is done.",
              "// This is intentionally not a rolling window: an overdue Pending/Scheduled import",
              "// must remain visible instead of silently aging out of the current Import Schedule.",
              "const IMPORT_STALE_CUTOFF = new Date(2026, 6, 1).getTime();",
          ])
          replace_once(old, new, "fixed import cutoff")

          old = "\n".join([
              "const hasShipmentDocuments = Boolean(",
              sp * 6 + "record.shipmentNo && (record.invoice || record.mbl || record.hbl || record.container),",
              sp * 4 + ");",
              sp * 4 + "if (!hasShipmentDocuments || parcelCarrier(record.shipmentNo)) return [];",
          ])
          new = "\n".join([
              "const hasShipmentIdentity = Boolean(record.shipmentNo);",
              sp * 4 + "// A current import remains operational while invoice/MBL/HBL/container details are incomplete.",
              sp * 4 + "// Requiring those fields hid newly scheduled rows that already had a shipment code and ETA/ETD.",
              sp * 4 + "if (!hasShipmentIdentity || parcelCarrier(record.shipmentNo)) return [];",
          ])
          replace_once(old, new, "relax import document requirement")

          old = "\n".join([
              "setItems(consolidateTruckingItems([",
              sp * 8 + "...pendingImportItems(imports),",
          ])
          new = "\n".join([
              "const importItems = pendingImportItems(imports);",
              sp * 6 + "const activeImportItems = importItems.filter((item) =>",
              sp * 8 + "item.date.getTime() >= IMPORT_STALE_CUTOFF &&",
              sp * 8 + "!finishedImports.has(item.status.toLowerCase()),",
              sp * 6 + ");",
              sp * 6 + "setItems(consolidateTruckingItems([",
              sp * 8 + "...importItems,",
          ])
          replace_once(old, new, "capture active import schedule")

          old = "\n".join([
              "const dashboardInventory = dashboardInventoryItems(inventoryDashboardTable);",
              sp * 6 + "setInboundInventory(uniqueInventoryItems([",
              sp * 8 + "...dashboardInventory.inbound,",
              sp * 8 + "...skwInboundItems(skwInboundTable),",
              sp * 6 + "], true));",
          ])
          new = "\n".join([
              "const dashboardInventory = dashboardInventoryItems(inventoryDashboardTable);",
              sp * 6 + "const allInboundInventory = uniqueInventoryItems([",
              sp * 8 + "...dashboardInventory.inbound,",
              sp * 8 + "...skwInboundItems(skwInboundTable),",
              sp * 6 + "], true);",
              sp * 6 + "// Inbound Inventory is a detail view of the active Import Schedule, not receiving history.",
              sp * 6 + "setInboundInventory(allInboundInventory.filter((inventoryItem) =>",
              sp * 8 + "activeImportItems.some((scheduleItem) =>",
              sp * 10 + "scheduleMatchesInventoryShipment(scheduleItem, inventoryItem),",
              sp * 8 + "),",
              sp * 6 + "));",
          ])
          replace_once(old, new, "filter inbound inventory by active import schedule")

          replace_once(
              "if (!selectedItem || !showLocation) return filteredItems.slice(0, 250);",
              "if (!selectedItem) return filteredItems.slice(0, 250);",
              "cross-panel match sorting",
          )
          replace_once(
              "if (!selectedItem || !showLocation) return;",
              "if (!selectedItem) return;",
              "cross-panel match scrolling",
          )
          replace_once(
              "\n".join([
                  "const selected = selectable && selectedItem?.id === item.id;",
                  sp * 14 + "const matching = !selectable && Boolean(selectedItem && inventoryProductsMatch(item, selectedItem));",
              ]),
              "\n".join([
                  "const selected = selectedItem?.id === item.id;",
                  sp * 14 + "const matching = Boolean(selectedItem && inventoryProductsMatch(item, selectedItem));",
              ]),
              "cross-panel row highlighting",
          )

          stock_title = text.index('title="Products in Stock"')
          stock_start = text.rfind("<InventoryPanel", 0, stock_title)
          stock_end = text.index("/>", stock_title) + 2
          stock_block = text[stock_start:stock_end]
          if "selectable" not in stock_block:
              needle = "loading={loading}\n"
              if stock_block.count(needle) != 1:
                  raise SystemExit("stock panel: could not locate loading prop")
              stock_block = stock_block.replace(
                  needle,
                  needle + sp * 10 + "onSelect={(item) => setSelectedInventory((current) => current?.id === item.id ? null : item)}\n" + sp * 10 + "selectable\n",
                  1,
              )
              text = text[:stock_start] + stock_block + text[stock_end:]

          old = "\n".join([
              "function LowStockPanel({",
              sp * 2 + "items,",
              sp * 2 + "inboundItems,",
              sp * 2 + "loading,",
              "}: {",
              sp * 2 + "items: InventoryItem[];",
              sp * 2 + "inboundItems: InventoryItem[];",
              sp * 2 + "loading: boolean;",
              "}) {",
          ])
          new = "\n".join([
              "function LowStockPanel({",
              sp * 2 + "items,",
              sp * 2 + "inboundItems,",
              sp * 2 + "loading,",
              sp * 2 + "selectedItem,",
              sp * 2 + "onSelect,",
              "}: {",
              sp * 2 + "items: InventoryItem[];",
              sp * 2 + "inboundItems: InventoryItem[];",
              sp * 2 + "loading: boolean;",
              sp * 2 + "selectedItem: InventoryItem | null;",
              sp * 2 + "onSelect?: (item: InventoryItem) => void;",
              "}) {",
          ])
          replace_once(old, new, "low stock shared selection props")

          low_start = text.index("function LowStockPanel({")
          low_end = text.index("\nexport default function", low_start)
          low = text[low_start:low_end]
          marker = "\n".join([
              sp * 2 + "const lowStockItems = useMemo(",
              sp * 4 + "() => items.filter((item) => item.quantity < 200).sort((a, b) => a.quantity - b.quantity),",
              sp * 4 + "[items],",
              sp * 2 + ");",
          ])
          if low.count(marker) != 1:
              raise SystemExit(f"low stock items marker: expected 1 match, found {low.count(marker)}")
          extra = "\n".join([
              "",
              sp * 2 + "const tableWrapRef = useRef<HTMLDivElement>(null);",
              sp * 2 + "const displayedLowStockItems = useMemo(() => {",
              sp * 4 + "if (!selectedItem) return lowStockItems;",
              sp * 4 + "return [...lowStockItems].sort((left, right) =>",
              sp * 6 + "Number(inventoryProductsMatch(right, selectedItem)) -",
              sp * 6 + "Number(inventoryProductsMatch(left, selectedItem)),",
              sp * 4 + ");",
              sp * 2 + "}, [lowStockItems, selectedItem]);",
              sp * 2 + "useEffect(() => {",
              sp * 4 + "if (!selectedItem) return;",
              sp * 4 + "const frame = window.requestAnimationFrame(() => {",
              sp * 6 + "const wrap = tableWrapRef.current;",
              sp * 6 + 'const matchedRow = wrap?.querySelector<HTMLTableRowElement>("tr.inventory-match");',
              sp * 6 + "if (!wrap || !matchedRow) return;",
              sp * 6 + "const targetTop = matchedRow.offsetTop - (wrap.clientHeight - matchedRow.offsetHeight) / 2;",
              sp * 6 + 'wrap.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });',
              sp * 6 + "matchedRow.focus({ preventScroll: true });",
              sp * 4 + "});",
              sp * 4 + "return () => window.cancelAnimationFrame(frame);",
              sp * 2 + "}, [displayedLowStockItems, selectedItem]);",
          ])
          low = low.replace(marker, marker + extra, 1)
          if low.count('<div className="inventory-table-wrap">') != 1:
              raise SystemExit("low stock table wrap not unique")
          low = low.replace('<div className="inventory-table-wrap">', '<div className="inventory-table-wrap" ref={tableWrapRef}>', 1)
          if low.count("{lowStockItems.map((item) => {") != 1:
              raise SystemExit("low stock map not unique")
          low = low.replace("{lowStockItems.map((item) => {", "{displayedLowStockItems.map((item) => {", 1)
          row_tag = '<tr key={item.id}>'
          if low.count(row_tag) != 1:
              raise SystemExit("low stock row tag not unique")
          interactive_row = "\n".join([
              "<tr",
              sp * 18 + "key={item.id}",
              sp * 18 + "aria-label={`Select ${item.productName || item.sku || item.upc}`}",
              sp * 18 + "aria-selected={Boolean(selectedItem && inventoryProductsMatch(item, selectedItem)) || undefined}",
              sp * 18 + "className={[",
              sp * 20 + '"inventory-selectable",',
              sp * 20 + 'selectedItem?.id === item.id ? "inventory-selected" : "",',
              sp * 20 + 'selectedItem && inventoryProductsMatch(item, selectedItem) ? "inventory-match" : "",',
              sp * 18 + '].filter(Boolean).join(" ")}',
              sp * 18 + "data-product-key={normalizedIdentifier(item.sku || item.upc || item.productName)}",
              sp * 18 + "onClick={() => onSelect?.(item)}",
              sp * 18 + "onKeyDown={(event) => {",
              sp * 20 + 'if (event.key === "Enter" || event.key === " ") {',
              sp * 22 + "event.preventDefault();",
              sp * 22 + "onSelect?.(item);",
              sp * 20 + "}",
              sp * 18 + "}}",
              sp * 18 + 'role="button"',
              sp * 18 + "tabIndex={0}",
              sp * 16 + ">",
          ])
          low = low.replace(row_tag, interactive_row, 1)
          text = text[:low_start] + low + text[low_end:]

          old = '<LowStockPanel items={warehouseStock} inboundItems={inboundInventory} loading={loading} />'
          new = "\n".join([
              "<LowStockPanel",
              sp * 8 + "items={warehouseStock}",
              sp * 8 + "inboundItems={inboundInventory}",
              sp * 8 + "loading={loading}",
              sp * 8 + "selectedItem={selectedInventory}",
              sp * 8 + "onSelect={(item) => setSelectedInventory((current) => current?.id === item.id ? null : item)}",
              sp * 6 + "/>",
          ])
          replace_once(old, new, "wire low stock shared selection")

          replace_once(
              "if (isFinishedOrStale && !includeFinished && !selectedShipment) return false;",
              "if (isFinishedOrStale && !includeFinished) return false;",
              "do not resurface finished imports from inventory selection",
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Commit tested fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-current-import-inventory-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/tmp-current-import-inventory-focus.yml
          git diff --cached --check
          git commit -m "Fix current import inventory linking and cross-focus"
          git push origin HEAD:fix/current-import-inventory-focus-20260810
