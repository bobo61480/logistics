name: Refine parcel ETA write-back

on:
  push:
    branches:
      - fix/import-boundaries-hourly-parcels-20260810

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-boundaries-hourly-parcels-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply no-churn ETA guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('google-apps-script/InventorySync.gs')
          text = path.read_text()
          marker = '''function mergeParcelAutoTrackingNote_(existing, signal) {
            var base = String(existing || "").replace(/\\s*\\[AUTO TRACK[^\\]]*\\]\\s*$/i, "").trim();'''
          replacement = '''function parcelCurrentEta_(text) {
            var value = String(text || "");
            var autoMatches = value.match(/\\[AUTO TRACK[^\\]]*ETA:(\\d{1,2}\\/\\d{1,2}\\/\\d{2,4})[^\\]]*\\]/ig);
            if (autoMatches && autoMatches.length) {
              var last = autoMatches[autoMatches.length - 1].match(/ETA:(\\d{1,2}\\/\\d{1,2}\\/\\d{2,4})/i);
              if (last) return last[1];
            }
            return parcelEtaFromText_(value);
          }

          function mergeParcelAutoTrackingNote_(existing, signal) {
            var base = String(existing || "").replace(/\\s*\\[AUTO TRACK[^\\]]*\\]\\s*$/i, "").trim();'''
          if text.count(marker) != 1:
              raise SystemExit(f'parcelCurrentEta insert expected 1 match, found {text.count(marker)}')
          text = text.replace(marker, replacement, 1)
          old = '''    if (signal.eta) {
                var nextNote = mergeParcelAutoTrackingNote_(existingEtaNote, {'''
          new = '''    var currentEta = parcelCurrentEta_(existingEtaNote);
              if (signal.eta && signal.eta !== currentEta) {
                var nextNote = mergeParcelAutoTrackingNote_(existingEtaNote, {'''
          if text.count(old) != 1:
              raise SystemExit(f'ETA write guard expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate
        run: |
          node --check < google-apps-script/InventorySync.gs
          npm ci
          npx tsc --noEmit
          npm test
      - name: Commit refinement
        shell: bash
        run: |
          rm .github/workflows/tmp-parcel-eta-no-churn.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/InventorySync.gs .github/workflows/tmp-parcel-eta-no-churn.yml
          git diff --cached --check
          git commit -m "Avoid unchanged hourly parcel ETA writes"
          git push origin HEAD:fix/import-boundaries-hourly-parcels-20260810
