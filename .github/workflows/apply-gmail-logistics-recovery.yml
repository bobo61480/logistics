name: Apply Gmail logistics recovery patch

on:
  push:
    branches:
      - fix/gmail-logistics-recovery-20260831
    paths:
      - scripts/patch-gmail-logistics-recovery.mjs
      - .github/workflows/apply-gmail-logistics-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-logistics-recovery-20260831
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply exact source transformations
        run: node scripts/patch-gmail-logistics-recovery.mjs

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch-gmail-logistics-recovery.mjs
          rm .github/workflows/apply-gmail-logistics-recovery.yml

      - name: Commit recovered source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: recover Gmail logistics automation"
          git push origin HEAD:fix/gmail-logistics-recovery-20260831
