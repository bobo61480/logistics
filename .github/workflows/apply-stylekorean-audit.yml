name: Apply StyleKorean audit refactor

on:
  push:
    branches: [audit/stylekorean-hardening-20260830]
    paths: [.github/workflows/apply-stylekorean-audit.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/stylekorean-hardening-20260830
          fetch-depth: 0
      - name: Apply surgical production-source cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('app/page.tsx')
          text = page_path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          def sub_once(pattern: str, replacement: str, label: str):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one regex match for {label}, found {count}')

          replace_once('import ShipmentEventTrackerCard from "./ShipmentEventTrackerCard";\n', '')
          replace_once('\n      <ShipmentEventTrackerCard />\n', '\n')

          sub_once(
              r'// The live-map tracking backend only integrates UPS/FedEx/USPS.*?function trackableCarrier\(value\?: string\): "ups" \| "fedex" \| "usps" \| null \{.*?\n\}',
              '''// Amazon Shipping tracking requires the carrierId returned by getRates/purchase,\n// which the current sheet model does not persist. DHL Unified, UPS, FedEx and USPS\n// can be looked up from the tracking number carried by the operational row.\nfunction trackableCarrier(value?: string): "ups" | "fedex" | "usps" | "dhl" | null {\n  const normalized = clean(value).toLowerCase();\n  if (normalized.includes("ups")) return "ups";\n  if (normalized.includes("fedex")) return "fedex";\n  if (normalized.includes("usps")) return "usps";\n  if (normalized.includes("dhl")) return "dhl";\n  return null;\n}''',
              'trackableCarrier',
          )

          sub_once(
              r'const LEGACY_WRITE_ENDPOINT =\n\s*process\.env\.NEXT_PUBLIC_APPS_SCRIPT_WRITE_URL \?\? "";\n',
              '',
              'legacy write endpoint constant',
          )

          sub_once(
              r'  try \{\n\s*const response = await fetch\(STATUS_ENDPOINT, \{.*?\n\s*return await parseConfirmation\(response\);\n\s*\} catch \(error\) \{.*?fetch\(LEGACY_WRITE_ENDPOINT, \{.*?\n\s*return await parseConfirmation\(response\);\n\s*\}',
              '''  const response = await fetch(STATUS_ENDPOINT, {\n    method: "POST",\n    headers: { "Content-Type": "application/json" },\n    body: JSON.stringify(payload),\n  });\n  return await parseConfirmation(response);''',
              'postStatus legacy fallback',
          )

          sub_once(
              r'  \} catch \(workerError\) \{\n\s*// Keep a read-only direct-Sheets fallback.*?\n\s*return \{\n\s*\.\.\.\(await fetchSheetSnapshot\(\)\),.*?\n\s*\};\n\s*\}',
              '''  } catch (workerError) {\n    // D1 is the canonical frontend source. If the Worker/D1 path is unavailable,\n    // surface the failure instead of silently switching the browser to Google Sheets.\n    throw workerError;\n  }''',
              'fetchOperationalSnapshot Sheets fallback',
          )

          replace_once('  storage?: "d1" | "sheets";\n', '  storage?: "d1";\n')
          replace_once('      liveKpis: snapshot.kpis ?? (await fetchLiveKpis()),\n', '      liveKpis: snapshot.kpis ?? EMPTY_KPIS,\n')

          sub_once(
              r': connection\?\.mode === "sheets"\n\s*\? "Direct Sheets fallback · Worker reconnecting"\n\s*: connection\?\.mode === "stale"\n\s*\? "Last good snapshot · live sources reconnecting"',
              ': connection?.mode === "stale"\n                    ? "Last good D1 snapshot · live sources reconnecting"',
              'sync strip Sheets branch',
          )
          replace_once('                        ? "D1 snapshot · Sheets fallback ready"\n', '                        ? "D1 snapshot · canonical frontend"\n')

          sub_once(
              r'      \{!error && connection && connection\.mode !== "worker" && \(\n\s*<div className="alert warning" role="status">.*?\n\s*</div>\n\s*\)\}',
              '''      {!error && connection?.mode === "stale" && (\n        <div className="alert warning" role="status">\n          <strong>Continuity mode.</strong>{" "}\n          The last verified D1 snapshot is still available while live workbook sources recover.\n          {connection.detail ? ` ${connection.detail}` : ""}\n        </div>\n      )}''',
              'fallback alert',
          )

          page_path.write_text(text)

          card = Path('app/ShipmentEventTrackerCard.tsx')
          if card.exists():
              card.unlink()

          test_path = Path('tests/production-source-consolidation.test.ts')
          test = test_path.read_text()
          if 'existsSync' not in test.splitlines()[0]:
              test = test.replace(
                  'import { readFileSync } from "node:fs";',
                  'import { existsSync, readFileSync } from "node:fs";',
                  1,
              )
          old = '''    const shipmentEvents = read("app/ShipmentEventTrackerCard.tsx");\n    expect(shipmentEvents).not.toContain("TRACKED_EVENTS");\n    expect(shipmentEvents).not.toContain("REVIEWED_THROUGH");\n    expect(shipmentEvents).not.toContain("08/22/26");\n    expect(shipmentEvents).toContain("return null");'''
          new = '''    const page = read("app/page.tsx");\n    expect(page).not.toContain("ShipmentEventTrackerCard");\n    expect(existsSync("app/ShipmentEventTrackerCard.tsx")).toBe(false);'''
          if old not in test:
              raise SystemExit('Expected consolidation test block was not found')
          test_path.write_text(test.replace(old, new, 1))
          PY

          git config user.name "StyleKorean Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No audit refactor changes required."
            exit 0
          fi
          git commit -m "Enforce D1 frontend and connect DHL tracking"
          git push origin HEAD:audit/stylekorean-hardening-20260830
