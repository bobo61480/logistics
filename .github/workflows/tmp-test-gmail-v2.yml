name: Test Gmail pipeline v2 samples
on:
  push:
    branches: [fix/gmail-logistics-pipeline-v2-20260810]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-logistics-pipeline-v2-20260810
      - name: Test real logistics subject/table patterns
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          vm.runInThisContext(fs.readFileSync('google-apps-script/GmailPipelineV2.gs','utf8'));
          function eq(actual, expected, name) {
            if (actual !== expected) throw new Error(`${name}: expected ${expected}, got ${actual}`);
          }
          let c = extractEmailContextV2_(
            'AIR SHIPMENT / MAWB #936-02523964 / HAWB #JSL260803 / TTL - 4 PLTS / ETA :8/11 /ICN-LAX',
            'Current LAX arrival is 8/11 @ 7:00 am. FILING# N8N-2608058-3'
          );
          eq(c.kind, 'inbound', 'air kind');
          eq(c.mbl, '936-02523964', 'mawb');
          eq(c.hbl, 'JSL260803', 'hawb');
          eq(c.eta, '08/11/26', 'yearless eta');
          eq(c.filing, 'N8N-2608058-3', 'filing');

          c = extractEmailContextV2_(
            '미주법인 ES 29차 선적서류 전달의 건_0810',
            'HBL # ESSAPUS26080269 VSL: MAERSK CAP JACKSON 632E ETD: 8/13 ETA: 8/29'
          );
          eq(c.shipmentNo, 'ES29 - 2026', 'step shipment');
          eq(c.hbl, 'ESSAPUS26080269', 'es29 hbl');
          eq(c.etd, '08/13/26', 'es29 etd');
          eq(c.eta, '08/29/26', 'es29 eta');

          let rows = [
            ['CNTR#','TERMINAL','ETD','ETA','VSL','CUSTOMS STATUS','NOTES / REMARKS'],
            ['RFCU5014086','Z978','7/26','8/11','SM SHANGHAI 2605E','','Updated'],
            ['HMMU4617984','FMS','8/01','8/14','HMM RAON 0025E','','']
          ];
          let recs = tableToShipmentRecordsV2_(rows, {kind:'inbound'}, 'SILICON2 LIST.xlsx');
          eq(recs.length, 2, 'silicon rows');
          eq(recs[0].container, 'RFCU5014086', 'container');
          eq(recs[0].eta, '08/11/26', 'sheet eta');
          eq(inboundMatchScoreV2_(['','','','','','','','RFCU5014086'], recs[0]), 120, 'container match score');

          c = extractEmailContextV2_('Shipment STY-2212 has been completed!', 'Invoice IN00463069 Cargomatic');
          eq(c.kind, 'outbound', 'carrier kind');
          eq(c.pro, 'STY-2212', 'carrier shipment');
          eq(c.invoice, 'IN00463069', 'carrier invoice');
          eq(c.status, 'Completed', 'carrier status');
          console.log('Gmail v2 extraction samples passed');
          NODE
      - name: Static checks
        run: |
          node --check < google-apps-script/GmailPipelineV2.gs
          node --check < google-apps-script/GmailPipeline.gs
          node --check < google-apps-script/Validation.gs
          node --check < google-apps-script/Triggers.gs
