name: Synchronize Google Sheets into production D1

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy canonical logistics site to Cloudflare"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: google-sheets-d1-production-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply stylekorean-logistics-read-model --remote

      - name: Mirror all registered Google Sheets tabs into D1
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          D1_DATABASE_NAME: stylekorean-logistics-read-model
          GOOGLE_SERVICE_ACCOUNT_JSON: "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}"
          GOOGLE_PRIVATE_KEY: "${{ secrets.GOOGLE_PRIVATE_KEY }}"
          CLASP_ACCESS_TOKEN: "${{ secrets.CLASP_ACCESS_TOKEN }}"
        run: node scripts/run-google-sheets-d1-sync.mjs

      - name: Verify D1 mirror health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute stylekorean-logistics-read-model --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM google_sheet_documents WHERE enabled=1) AS documents, (SELECT COUNT(*) FROM google_sheet_tabs) AS tabs, (SELECT COUNT(*) FROM google_sheet_tabs WHERE mode='mirror' AND content_hash IS NOT NULL) AS mirrored_tabs, (SELECT COUNT(*) FROM google_sheet_tabs WHERE frontend_enabled=1 AND content_hash IS NULL) AS missing_frontend_tabs, (SELECT COUNT(*) FROM google_sheet_tabs WHERE last_error IS NOT NULL) AS error_tabs;" \
            | tee /tmp/d1-sheet-health.json
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/d1-sheet-health.json','utf8');
          const start=Math.min(...[text.indexOf('['), text.indexOf('{')].filter(i=>i>=0));
          const parsed=JSON.parse(text.slice(start));
          const rows=Array.isArray(parsed)?parsed.flatMap(x=>x.results||[]):[];
          const h=rows[0]||{};
          console.log('D1 Google Sheets mirror:', h);
          if(Number(h.documents)!==3 || Number(h.tabs)!==73 || Number(h.missing_frontend_tabs)!==0 || Number(h.error_tabs)!==0) process.exit(1);
          NODE