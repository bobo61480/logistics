# StyleKorean Logistics Planner — Next.js static export → GitHub Pages
# Repo setting required once: Settings → Pages → Source = "GitHub Actions".
name: Deploy Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npx next build

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — export failed"; exit 1; }
          test -f out/CNAME || { echo "::error::out/CNAME missing — custom domain would detach"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
