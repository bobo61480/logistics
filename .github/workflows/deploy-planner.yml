# StyleKorean Logistics Planner — Next.js static export → GitHub Pages
# Repo setting required once: Settings → Pages → Source = "GitHub Actions".
#
# Also deploys google-apps-script/ to the live Apps Script project via clasp
# whenever Apps Script source changes. Requires one secret in Settings → Secrets:
#   CLASP_ACCESS_TOKEN  — JSON content of ~/.clasprc.json after `clasp login`
#
# IMPORTANT: `clasp push` only syncs source code into the Apps Script editor —
# it does NOT move the live /exec URL forward on its own (Apps Script pins
# deployments to a frozen version snapshot). Without the "Update the live
# deployment" step below, every push would silently update code nobody is
# actually running, which is exactly the trap that caused a full afternoon of
# "why doesn't my status write back" debugging on 2026-08-07 — see
# DEPLOYMENT_NOTE.md. That step re-points the EXISTING deployment ID (kept in
# WRITE_ENDPOINT_DEPLOYMENT_ID below) at the newly-pushed code, so
# WRITE_ENDPOINT in app/page.tsx never has to change.
name: Deploy Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The deployment ID embedded in WRITE_ENDPOINT (app/page.tsx). If you ever
  # create a *new* deployment instead of updating this one, you must update
  # BOTH this value and WRITE_ENDPOINT together, or the dashboard and the
  # auto-deploy job will silently point at two different deployments again.
  WRITE_ENDPOINT_DEPLOYMENT_ID: AKfycbz770kmpwqMTA-h-lzeLARgVnDh_VDjh-70OOKk_yE-iXJTmzAsVXUtln17QTOURO1R

jobs:
  deploy-apps-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always start this lightweight job, then use the actual Git diff to decide
    # whether Apps Script must be pushed. The push-event commits.*.modified list
    # can be incomplete after squash merges.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Apps Script changes
        id: apps-script-changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            changed=true
          else
            before=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("before", ""))')
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed=true
            elif git diff --quiet "$before" "$GITHUB_SHA" -- google-apps-script/; then
              changed=false
            else
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Apps Script changed: $changed"

      - uses: actions/setup-node@v4
        if: steps.apps-script-changes.outputs.changed == 'true'
        with:
          node-version: '22.13.0'

      - name: Install clasp
        if: steps.apps-script-changes.outputs.changed == 'true'
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        if: steps.apps-script-changes.outputs.changed == 'true'
        # CLASP_ACCESS_TOKEN must be set in repo secrets (Settings → Secrets → Actions).
        # Value is the full JSON content of ~/.clasprc.json after running `clasp login` locally.
        run: echo '${{ secrets.CLASP_ACCESS_TOKEN }}' > ~/.clasprc.json

      - name: Push to Apps Script
        if: steps.apps-script-changes.outputs.changed == 'true'
        # clasp reads .clasp.json at repo root (rootDir = google-apps-script)
        run: clasp push --force

      - name: Update the live deployment
        if: steps.apps-script-changes.outputs.changed == 'true'
        # Creates a new version snapshot AND re-points the existing deployment
        # (same /exec URL) at it in one step. Without --deploymentId, `clasp
        # deploy` would create a brand-new deployment with a different URL,
        # which app/page.tsx's WRITE_ENDPOINT would then be pointing past.
        run: |
          clasp deploy \
            --deploymentId "$WRITE_ENDPOINT_DEPLOYMENT_ID" \
            --description "Auto-deploy from GitHub Actions ($GITHUB_SHA)"

  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        # Gate the Pages deploy on the KPI/parser unit suite (fast, no browser).
        run: npm test

      - name: Build static export
        run: npx next build

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — export failed"; exit 1; }
          test -f out/CNAME || { echo "::error::out/CNAME missing — custom domain would detach"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
