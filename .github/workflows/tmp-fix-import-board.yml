name: Fix import board and inventory semantics
on:
  push:
    branches: [fix/import-board-inventory-source-semantics-20260810]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-board-inventory-source-semantics-20260810
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/patch_import_semantics.py
      - name: Static assertions
        run: |
          grep -q 'planningRow' app/page.tsx
          grep -q 'deliveryExpected: record.deliveryExpected' app/page.tsx
          grep -q 'inventoryForActiveImports' app/page.tsx
          grep -q 'Warehouse receiving appointments' app/page.tsx
          git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --check
          git commit -m "Fix import schedule, inbound board, and inventory source semantics"
          git push origin HEAD:fix/import-board-inventory-source-semantics-20260810
