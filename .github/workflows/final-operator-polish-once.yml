name: One-time final operator polish

on:
  push:
    branches: [feat/final-operator-health-polish-20260812]
    paths:
      - '.github/workflows/final-operator-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-operator-health-polish-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Correct KPI presentation wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          replacements = {
              '<small>Earnings</small>': '<small>Freight Spend</small>',
              '<small>LOCAL ≤50 MI</small>': '<small>LOCAL / REGIONAL HEURISTIC</small>',
              'exclude transfers and unclassified destinations; local is within 50 miles of Buena Park.': 'exclude transfers and unclassified destinations; local / regional uses a destination city/ZIP heuristic for the Southern California operating area and is not a measured mileage radius.',
              'Carrier earnings use the same freight Invoice-first, Rate-fallback cost': 'Carrier freight spend uses the same freight Invoice-first, Rate-fallback cost',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified wording changes
        run: |
          set -euo pipefail
          git config user.name "StyleKorean Control Tower Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: label freight spend and heuristic lanes accurately"
          git push origin HEAD:feat/final-operator-health-polish-20260812
