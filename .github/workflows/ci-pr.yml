name: Fulfillment TK Pull Request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/fulfillment-tk-panel.tsx"
      - "app/fulfillment-tk-source.css"
      - "app/style-variants.module.css"
      - "tests/style-variants.test.ts"
      - ".github/workflows/ci-pr.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fulfillment style regression tests
        run: npm test -- tests/style-variants.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
