name: Build Style Variants

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-variants:
    if: "contains(github.event.head_commit.message, 'chore: run style variant builder')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Write failing route tests
        shell: bash
        run: |
          cat > tests/style-variants.test.ts <<'EOF'
          import { describe, expect, test } from "vitest";
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const read = (file: string) => fs.readFileSync(path.join(root, file), "utf8");

          describe("dashboard style variants", () => {
            test.each([
              ["app/light/page.tsx", "site-shell variant-light"],
              ["app/fulfillment-style/page.tsx", "site-shell variant-fulfillment-sales"],
            ])("%s preserves live sync and writeback behavior", (file, rootClass) => {
              expect(fs.existsSync(path.join(root, file))).toBe(true);
              const source = read(file);
              expect(source).toContain('const AUTO_REFRESH_MS = 60 * 1000;');
              expect(source).toContain('const WRITE_ENDPOINT =');
              expect(source).toContain(rootClass);
              expect(source).toContain('href="/"');
              expect(source).toContain('href="/light"');
              expect(source).toContain('href="/fulfillment-style"');
            });

            test.each([
              "app/light/page.tsx",
              "app/fulfillment-style/page.tsx",
            ])("%s puts TK orders immediately after outbound trucking schedule", (file) => {
              const source = read(file);
              const outboundAnchor = 'direction="outbound"\n          days={days}\n          items={outboundVisibleItems}';
              const outboundIndex = source.indexOf(outboundAnchor);
              const tkIndex = source.indexOf('<FulfillmentTkPanel', outboundIndex);
              const parcelIndex = source.indexOf('<SmallParcelSchedule\n          direction="outbound"', outboundIndex);
              expect(outboundIndex).toBeGreaterThan(-1);
              expect(tkIndex).toBeGreaterThan(outboundIndex);
              expect(parcelIndex).toBeGreaterThan(tkIndex);
            });

            test("fulfillment panel formats money-like fields with a dollar prefix", () => {
              const source = read("app/fulfillment-tk-panel.tsx");
              expect(source).toContain("function formatFulfillmentValue");
              expect(source).toContain('style: "currency"');
              expect(source).toContain('currency: "USD"');
            });

            test("variant CSS contains both approved visual themes", () => {
              const css = read("app/globals.css");
              expect(css).toContain(".variant-light");
              expect(css).toContain(".variant-fulfillment-sales");
              expect(css).toContain("--variant-mint");
              expect(css).toContain("--lookup-green");
            });
          });
          EOF

      - name: Verify tests fail before implementation
        shell: bash
        run: |
          set +e
          npm test -- tests/style-variants.test.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected RED tests to fail before implementation, but they passed."
            exit 1
          fi
          echo "RED confirmed: variant tests fail before implementation."

      - name: Implement live style variants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          base = (root / 'app/page.tsx').read_text()

          tk_block = '''      <FulfillmentTkPanel
                jobs={fulfillmentTkJobs}
                error={fulfillmentTkError}
                loading={loading}
              />\n\n'''.replace('              ', '      ', 1)
          # Use the exact block from the canonical page.
          exact_tk = '''      <FulfillmentTkPanel
                jobs={fulfillmentTkJobs}
                error={fulfillmentTkError}
                loading={loading}
              />'''.replace('              ', '      ', 1)
          exact_tk = '''      <FulfillmentTkPanel
                jobs={fulfillmentTkJobs}
                error={fulfillmentTkError}
                loading={loading}
              />'''
          # Canonical indentation is six spaces for props in JSX output.
          exact_tk = '''      <FulfillmentTkPanel
                jobs={fulfillmentTkJobs}
                error={fulfillmentTkError}
                loading={loading}
              />'''.replace('              jobs', '        jobs').replace('              error', '        error').replace('              loading', '        loading').replace('              />', '      />')

          outbound_block = '''        <ScheduleBoard
          direction="outbound"
          days={days}
          items={outboundVisibleItems}
          loading={loading}
          savingId={savingId}
          onStatus={handleStatus}
        />'''
          inserted_tk = '''        <FulfillmentTkPanel
          jobs={fulfillmentTkJobs}
          error={fulfillmentTkError}
          loading={loading}
        />'''

          def make_variant(route: str, root_class: str):
              src = base
              src = src.replace('from "./inbound-links"', 'from "../inbound-links"')
              src = src.replace('from "./inbound-invoice-links"', 'from "../inbound-invoice-links"')
              src = src.replace('from "./inbound-pallets"', 'from "../inbound-pallets"')
              src = src.replace('from "../lib/sales-kpis"', 'from "../../lib/sales-kpis"')
              src = src.replace('from "./fulfillment-tk-panel"', 'from "../fulfillment-tk-panel"')
              # Remove the original top-level TK panel before the KPI panel.
              original = '''      <FulfillmentTkPanel
        jobs={fulfillmentTkJobs}
        error={fulfillmentTkError}
        loading={loading}
      />\n\n'''
              if original not in src:
                  raise SystemExit('Could not find original TK panel block')
              src = src.replace(original, '', 1)
              if outbound_block not in src:
                  raise SystemExit('Could not find outbound ScheduleBoard block')
              src = src.replace(outbound_block, outbound_block + '\n' + inserted_tk, 1)
              src = src.replace('<main className="site-shell">', f'<main className="site-shell {root_class}">', 1)
              nav = '''      <nav className="variant-nav" aria-label="Dashboard style variants">
        <a href="/">Original</a>
        <a href="/light">Light Dashboard</a>
        <a href="/fulfillment-style">Fulfillment Style</a>
      </nav>\n'''
              src = src.replace(f'<main className="site-shell {root_class}">\n', f'<main className="site-shell {root_class}">\n{nav}', 1)
              target = root / f'app/{route}/page.tsx'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(src)

          make_variant('light', 'variant-light')
          make_variant('fulfillment-style', 'variant-fulfillment-sales')

          panel = root / 'app/fulfillment-tk-panel.tsx'
          p = panel.read_text()
          helper = '''\nfunction isMoneyField(key: string) {
  return /(^|[_\\s-])(amount|cost|rate|price|total|sales|earning|earnings|freight|shipping)([_\\s-]|$)/i.test(key);
}

function formatFulfillmentValue(key: string, value: string) {
  if (!value || !isMoneyField(key)) return value;
  const normalized = value.replace(/[$,\\s]/g, "");
  const numeric = Number(normalized);
  if (!Number.isFinite(numeric)) return value.startsWith("$") ? value : `$${value}`;
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  }).format(numeric);
}
'''
          anchor = '\nfunction titleFor(key: string) {'
          if 'function formatFulfillmentValue' not in p:
              p = p.replace(anchor, helper + anchor, 1)
          p = p.replace('''                  const value = clean(job[key]);
                  return <td key={key} title={value || undefined}>{value || "—"}</td>;''', '''                  const rawValue = clean(job[key]);
                  const value = formatFulfillmentValue(key, rawValue);
                  return <td key={key} title={value || undefined}>{value || "—"}</td>;''')
          panel.write_text(p)

          css_path = root / 'app/globals.css'
          css = css_path.read_text()
          marker = '/* STYLE VARIANTS: LIGHT + FULFILLMENT SALES LOOKUP */'
          if marker not in css:
              css += r'''

/* STYLE VARIANTS: LIGHT + FULFILLMENT SALES LOOKUP */
.variant-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 8px;
  padding: 7px;
  border: 1px solid rgba(63, 76, 89, .14);
  border-radius: 10px;
  background: rgba(255, 255, 255, .88);
  box-shadow: 0 4px 18px rgba(31, 42, 55, .06);
}
.variant-nav a {
  padding: 7px 11px;
  border: 1px solid rgba(63, 76, 89, .14);
  border-radius: 8px;
  background: #fff;
  color: #284047;
  font: 700 9px "IBM Plex Mono", monospace;
  text-decoration: none;
}
.variant-nav a:hover { transform: translateY(-1px); }

.variant-light {
  --variant-blue: #eaf3ff;
  --variant-mint: #e9f8ef;
  --variant-lavender: #f2edff;
  --variant-amber: #fff7df;
  --variant-rose: #fff0f0;
  --variant-border: #dbe5ee;
  color: #21313a;
}
.variant-light .manifest {
  border-color: #dce6ee;
  border-radius: 12px;
  background: #ffffff;
  color: #21313a;
  box-shadow: 0 10px 28px rgba(64, 84, 103, .08);
}
.variant-light .route-strip,
.variant-light .sync-strip {
  background: #f6f9fc;
  color: #607180;
}
.variant-light .route-strip i { background: #dbe5ee; }
.variant-light .manifest-main { border-color: #e2eaf0; }
.variant-light .manifest h1 { color: #172933; }
.variant-light .manifest h1 em { color: #3a78c2; }
.variant-light .intro { color: #61717c; }
.variant-light .button { border-color: #d7e2eb; color: #284047; background: #fff; border-radius: 8px; }
.variant-light .button.primary { border-color: #5c96db; background: #5c96db; color: #fff; }
.variant-light .metrics article { border-color: var(--variant-border); border-radius: 10px; box-shadow: 0 5px 16px rgba(64, 84, 103, .05); }
.variant-light .metrics article:nth-child(1) { background: var(--variant-blue); }
.variant-light .metrics article:nth-child(2) { background: var(--variant-mint); }
.variant-light .metrics article:nth-child(3) { background: var(--variant-amber); }
.variant-light .metrics article:nth-child(4) { background: var(--variant-rose); }
.variant-light .metrics article:nth-child(5) { background: var(--variant-lavender); }
.variant-light .kpi-panel,
.variant-light .inventory-panel,
.variant-light .parcel-panel,
.variant-light .import-panel,
.variant-light .fulfillment-tk-panel,
.variant-light .schedule-board {
  border-color: var(--variant-border);
  border-radius: 12px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 6px 20px rgba(64, 84, 103, .055);
  overflow: hidden;
}
.variant-light .kpi-card { background: #fcfdff; }
.variant-light .kpi-card:nth-child(4n+1) { background: #f6faff; }
.variant-light .kpi-card:nth-child(4n+2) { background: #f5fbf7; }
.variant-light .kpi-card:nth-child(4n+3) { background: #fffbef; }
.variant-light .kpi-card:nth-child(4n+4) { background: #faf7ff; }
.variant-light .fulfillment-tk-panel { box-shadow: inset 0 4px 0 #45a56e, 0 6px 20px rgba(64,84,103,.055); }
.variant-light .fulfillment-tk-panel .panel-heading { background: linear-gradient(90deg, #edf9f1, #f8fcfa); }
.variant-light .fulfillment-tk-table th { background: #e7f6ec; color: #23613e; border-bottom: 1px solid #cfe8d7; }
.variant-light .fulfillment-tk-table tbody tr:nth-child(even) { background: #fbfdfc; }
.variant-light .fulfillment-tk-table td { border-bottom-color: #e5eee9; }
.variant-light .status.done { background: #dcf6e7; color: #226440; }
.variant-light .status.active { background: #e5f0ff; color: #285d94; }
.variant-light .status.warning { background: #fff0d2; color: #815918; }
.variant-light .alert { border-radius: 10px; background: #fff3f1; }
.variant-light .control-panel,
.variant-light .source-legend { border-radius: 10px; border-color: var(--variant-border); background: rgba(255,255,255,.9); }

.variant-fulfillment-sales {
  --lookup-green: #138a55;
  --lookup-green-dark: #0f6b43;
  --lookup-green-soft: #eaf8f0;
  --lookup-blue-soft: #edf5ff;
  --lookup-amber-soft: #fff7e4;
  --lookup-red-soft: #fff0f0;
  --lookup-line: #e2e8ec;
  color: #26343b;
}
.variant-fulfillment-sales .manifest {
  border: 1px solid #dfe7e3;
  border-radius: 8px;
  background: #fff;
  color: #26343b;
  box-shadow: 0 5px 18px rgba(28, 52, 42, .06);
}
.variant-fulfillment-sales .route-strip { background: #f5faf7; color: #63736b; }
.variant-fulfillment-sales .route-strip i { background: #d9e6df; }
.variant-fulfillment-sales .manifest-main { border-color: #e4ece8; padding-block: 14px; }
.variant-fulfillment-sales .manifest h1 { color: #172a20; font-size: clamp(34px, 4vw, 52px); }
.variant-fulfillment-sales .eyebrow { color: var(--lookup-green); }
.variant-fulfillment-sales .intro { color: #69766f; }
.variant-fulfillment-sales .button { border-color: #d9e5de; border-radius: 6px; background: #fff; color: #375247; }
.variant-fulfillment-sales .button.primary { background: var(--lookup-green); border-color: var(--lookup-green); color: #fff; }
.variant-fulfillment-sales .sync-strip { background: #f7fbf9; color: #627269; border-top: 1px solid #e3ebe7; }
.variant-fulfillment-sales .metrics { gap: 8px; }
.variant-fulfillment-sales .metrics article { border: 1px solid var(--lookup-line); border-radius: 8px; background: #fff; box-shadow: none; }
.variant-fulfillment-sales .metrics article::before { width: 3px; background: var(--lookup-green); }
.variant-fulfillment-sales .fulfillment-tk-panel {
  margin-top: 8px;
  border: 1px solid #cfe3d7;
  border-radius: 8px;
  background: #fff;
  box-shadow: inset 0 3px 0 var(--lookup-green);
  overflow: hidden;
}
.variant-fulfillment-sales .fulfillment-tk-panel .panel-heading { padding: 12px 14px; background: #f5fbf7; border-bottom: 1px solid #dbe9e1; }
.variant-fulfillment-sales .fulfillment-tk-panel .inventory-heading h2 { color: #17633f; font-size: 24px; }
.variant-fulfillment-sales .fulfillment-tk-panel .inventory-toolbar { background: #fff; padding-top: 8px; }
.variant-fulfillment-sales .fulfillment-tk-table { font-size: 10px; }
.variant-fulfillment-sales .fulfillment-tk-table th {
  padding: 7px 8px;
  background: #edf8f1;
  color: #2e6046;
  border-bottom: 1px solid #d2e7db;
}
.variant-fulfillment-sales .fulfillment-tk-table td { padding: 7px 8px; border-bottom: 1px solid #edf1ef; }
.variant-fulfillment-sales .fulfillment-tk-table tbody tr:hover { background: #f8fcfa; }
.variant-fulfillment-sales .status { border-radius: 999px; border: 0; padding: 4px 8px; background: #f0f3f5; color: #55626a; }
.variant-fulfillment-sales .status.done { background: var(--lookup-green-soft); color: var(--lookup-green-dark); }
.variant-fulfillment-sales .status.active { background: var(--lookup-blue-soft); color: #285f9a; }
.variant-fulfillment-sales .status.warning { background: var(--lookup-amber-soft); color: #885e19; }
.variant-fulfillment-sales .metric-alert .status,
.variant-fulfillment-sales .alert { background: var(--lookup-red-soft); color: #8a3434; }
.variant-fulfillment-sales .kpi-panel,
.variant-fulfillment-sales .inventory-panel,
.variant-fulfillment-sales .parcel-panel,
.variant-fulfillment-sales .import-panel,
.variant-fulfillment-sales .schedule-board {
  border-color: var(--lookup-line);
  border-radius: 8px;
  background: #fff;
  box-shadow: none;
  overflow: hidden;
}
.variant-fulfillment-sales .kpi-panel { box-shadow: inset 0 3px 0 var(--lookup-green); }
.variant-fulfillment-sales .kpi-card { background: #fff; }
.variant-fulfillment-sales .kpi-grid { background: #edf1ef; }
.variant-fulfillment-sales .inventory-table th { background: #f2f7f4; color: #385147; border-bottom: 1px solid #dfe8e3; }
.variant-fulfillment-sales .inventory-table td { border-bottom-color: #edf1ef; }
.variant-fulfillment-sales .control-panel,
.variant-fulfillment-sales .source-legend { border-color: var(--lookup-line); border-radius: 8px; background: #fff; }
.variant-fulfillment-sales footer { color: #6a7770; }
'''
          css_path.write_text(css)
          PY

      - name: Verify GREEN tests
        run: npm test -- tests/style-variants.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit tests
        run: npm test
      - name: Build all routes
        run: npm run build
      - name: Verify static routes
        shell: bash
        run: |
          test -f out/light/index.html
          test -f out/fulfillment-style/index.html
          grep -q "Fulfillment TK Orders" out/light/index.html
          grep -q "Fulfillment TK Orders" out/fulfillment-style/index.html
      - name: Commit verified variants
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/light/page.tsx app/fulfillment-style/page.tsx app/fulfillment-tk-panel.tsx app/globals.css tests/style-variants.test.ts
          git commit -m "feat: add live dashboard style variants"
          git push
