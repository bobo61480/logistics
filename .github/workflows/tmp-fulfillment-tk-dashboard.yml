name: Validate TK fulfillment dashboard integration
on:
  push:
    branches: [feat/fulfillment-tk-dashboard-20260810]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python scripts/patch_fulfillment_tk_dashboard.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test -- --run
      - name: Build static export
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Commit validated source changes
        run: |
          git config user.name "tokkiboi"
          git config user.email "tokkiboi@users.noreply.github.com"
          git add app/page.tsx app/globals.css e2e/dashboard.spec.ts
          git commit -m "Add live TK fulfillment dashboard source"
          git push
