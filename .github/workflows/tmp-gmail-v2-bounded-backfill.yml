name: Validate bounded Gmail v2 backfill
on:
  push:
    branches: [fix/gmail-v2-bounded-backfill-20260810]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-v2-bounded-backfill-20260810
          fetch-depth: 0
      - name: Apply bounded backfill patch
        run: python3 scripts/patch_gmail_v2_bounded_backfill.py
      - name: Validate Apps Script syntax and structure
        run: |
          node --check < google-apps-script/GmailPipelineV2.gs
          grep -q 'GMAIL_V2_MAX_THREADS = 12' google-apps-script/GmailPipelineV2.gs
          grep -q 'GMAIL_V2_RUNTIME_BUDGET_MS = 210000' google-apps-script/GmailPipelineV2.gs
          grep -q 'deferredThreads' google-apps-script/GmailPipelineV2.gs
          grep -q 'elapsedMs' google-apps-script/GmailPipelineV2.gs
          git diff --check
      - name: Regression tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Commit Apps Script fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/GmailPipelineV2.gs
          git diff --cached --check
          git commit -m "Bound Gmail backfill runtime and batch size"
          git push origin HEAD:fix/gmail-v2-bounded-backfill-20260810
