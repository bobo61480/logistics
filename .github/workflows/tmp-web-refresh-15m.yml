name: Validate 15 minute web refresh
on:
  push:
    branches: [fix/web-refresh-15min-20260810]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-refresh-15min-20260810
          fetch-depth: 0
      - name: Align dashboard refresh with Gmail cycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'const AUTO_REFRESH_MS = 30 * 60 * 1000;'
          if s.count(old) != 1:
              raise SystemExit(f'expected one refresh constant, found {s.count(old)}')
          s = s.replace(old, 'const AUTO_REFRESH_MS = 15 * 60 * 1000;', 1)
          old_footer = 'AUTO-REFRESH 30 MIN · STATUS EDITS SYNC TO SOURCE ROWS'
          if s.count(old_footer) != 1:
              raise SystemExit(f'expected one footer refresh label, found {s.count(old_footer)}')
          s = s.replace(old_footer, 'AUTO-REFRESH 15 MIN · STATUS EDITS SYNC TO SOURCE ROWS', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Regression tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --check
          git commit -m "Align web auto-refresh with Gmail ingestion"
          git push origin HEAD:fix/web-refresh-15min-20260810
