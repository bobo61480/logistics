name = "logistics"
main = "worker/cached-index.ts"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "stylekorean.dpdns.org"
custom_domain = true

[vars]
APPS_SCRIPT_WRITE_URL = "https://script.google.com/macros/s/AKfycbz770kmpwqMTA-h-lzeLARgVnDh_VDjh-70OOKk_yE-iXJTmzAsVXUtln17QTOURO1R/exec"
# Fulfillment (sk-b2b-mobile WMS) Apps Script endpoint. The browser reaches it
# only through the same-origin /api/logistics/fulfillment proxy so no frontend
# read bypasses the Worker.
FULFILLMENT_GAS_URL = "https://script.google.com/macros/s/AKfycbykK9DWjem9ORHxfR_mpdZl5DVh-en0D6JpCdIuel305QmfqxoNU_NqSnjkhFk401hI/exec"
CMS_MCP_URL = "https://cms.mcp.siliconii.com/mcp/"
CMS_GATEWAY_URL = "https://stylekorean-cms-gateway.stylekorean.workers.dev"
# Separate write-only gateway (CMS write rollout). Token stays a Worker secret.
CMS_WRITE_GATEWAY_URL = "https://stylekorean-cms-write-gateway.stylekorean.workers.dev"

[[ratelimits]]
name = "STATUS_WRITE_RATE_LIMITER"
namespace_id = "2026081301"
simple = { limit = 30, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "stylekorean-logistics-read-model"
database_id = "b7eba1d8-839f-4f18-b537-02b1b536927b"
migrations_dir = "./migrations"

[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = false
head_sampling_rate = 0.1
